<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obhoy — claims integrity network</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧾</text></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>Obhoy</h1>
      <p>Claims-integrity network &middot; local prototype</p>
    </div>
  </div>

  <div class="identity">
    <label for="role">Acting as</label>
    <select id="role" aria-label="Organisation you are acting as"></select>
    <span id="role-class" class="pill"></span>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>

<main id="view" aria-live="polite">
  <div class="loading">Connecting to the ledger&hellip;</div>
</main>

<div id="toast" class="toast" role="status" aria-live="assertive"></div>

<footer class="foot">
  <span>Everything here is synthetic. No real identity, facility or policy appears in this prototype.</span>
  <span id="node-state"></span>
</footer>

<script type="module" src="/js/app.js"></script>
</body>
</html>
