      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_METRICS_PROVIDER=disabled
    ports: ["7050:7050", "7053:7053"]
    volumes:
      - ../../organizations/ordererOrganizations/idra.obhoy.local/orderers/orderer1.idra.obhoy.local/msp:/var/hyperledger/orderer/msp
      - ../../organizations/ordererOrganizations/idra.obhoy.local/orderers/orderer1.idra.obhoy.local/tls:/var/hyperledger/orderer/tls
