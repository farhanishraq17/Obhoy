# The development profile: three organisations, one ordering node, one channel.
#
# GENERATED from docker-compose.demo.yaml by network/scripts/gen-dev-compose.py.
# Edit the demo file and regenerate; do not edit this one by hand, or the two
# will drift and the dev network will stop being a faithful subset.
#
# This profile is what everyone runs day to day. It is deliberately NOT a
# smaller version of the same claim:
#
#   - With one insurer there is no cross-insurer duplicate to refuse. Scenario
#     S2, the headline, cannot be demonstrated here at all.
#   - With one ordering node there is no institutional spread and no Raft
#     cluster -- just a single process that can stop the network.
#   - The endorsement policy on obhoy-dev is weaker than the real one.
#
# Do not screenshot this profile and call it the architecture.
name: obhoy-dev
volumes:
  orderer1: {}
  peer-provider: {}
  peer-field: {}
  peer-insurera: {}
networks:
  obhoy:
    name: obhoy_net
services:
  orderer1.idra.obhoy.local:
    image: hyperledger/fabric-orderer:2.5.10
    networks:
    - obhoy
    environment:
    - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
    - ORDERER_GENERAL_LISTENPORT=7050
    - ORDERER_GENERAL_LOCALMSPID=OrdererIDRAMSP
    - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    - ORDERER_GENERAL_TLS_ENABLED=true
    - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
    - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    - ORDERER_ADMIN_TLS_ENABLED=true
    - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
    - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
    - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    - ORDERER_METRICS_PROVIDER=disabled
    working_dir: /root
    command: orderer
    container_name: orderer1.idra.obhoy.local
    ports:
    - 7050:7050
    - 7053:7053
    volumes:
    - ../../organizations/ordererOrganizations/idra.obhoy.local/orderers/orderer1.idra.obhoy.local/msp:/var/hyperledger/orderer/msp
    - ../../organizations/ordererOrganizations/idra.obhoy.local/orderers/orderer1.idra.obhoy.local/tls:/var/hyperledger/orderer/tls
    - orderer1:/var/hyperledger/production/orderer
  peer0.provider.obhoy.local:
    image: hyperledger/fabric-peer:2.5.10
    networks: &id001
    - obhoy
    environment:
    - FABRIC_LOGGING_SPEC=INFO
    - CORE_PEER_ID=peer0.provider.obhoy.local
    - CORE_PEER_ADDRESS=peer0.provider.obhoy.local:7051
    - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
    - CORE_PEER_CHAINCODEADDRESS=peer0.provider.obhoy.local:7052
    - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
    - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.provider.obhoy.local:7051
    - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.provider.obhoy.local:7051
    - CORE_PEER_LOCALMSPID=ProviderMSP
    - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    - CORE_PEER_TLS_ENABLED=true
    - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
    - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
    - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
    - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=obhoy_net
    - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    - CORE_METRICS_PROVIDER=disabled
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    container_name: peer0.provider.obhoy.local
    ports:
    - 7051:7051
    volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
    - ../../organizations/peerOrganizations/provider.obhoy.local/peers/peer0.provider.obhoy.local/msp:/etc/hyperledger/fabric/msp
    - ../../organizations/peerOrganizations/provider.obhoy.local/peers/peer0.provider.obhoy.local/tls:/etc/hyperledger/fabric/tls
    - peer-provider:/var/hyperledger/production
  peer0.field.obhoy.local:
    image: hyperledger/fabric-peer:2.5.10
    networks: *id001
    environment:
    - FABRIC_LOGGING_SPEC=INFO
    - CORE_PEER_ID=peer0.field.obhoy.local
    - CORE_PEER_ADDRESS=peer0.field.obhoy.local:7051
    - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
    - CORE_PEER_CHAINCODEADDRESS=peer0.field.obhoy.local:7052
    - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
    - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.field.obhoy.local:7051
    - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.field.obhoy.local:7051
    - CORE_PEER_LOCALMSPID=FieldMSP
    - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    - CORE_PEER_TLS_ENABLED=true
    - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
    - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
    - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
    - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=obhoy_net
    - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    - CORE_METRICS_PROVIDER=disabled
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    container_name: peer0.field.obhoy.local
    ports:
    - 9051:7051
    volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
    - ../../organizations/peerOrganizations/field.obhoy.local/peers/peer0.field.obhoy.local/msp:/etc/hyperledger/fabric/msp
    - ../../organizations/peerOrganizations/field.obhoy.local/peers/peer0.field.obhoy.local/tls:/etc/hyperledger/fabric/tls
    - peer-field:/var/hyperledger/production
  peer0.insurera.obhoy.local:
    image: hyperledger/fabric-peer:2.5.10
    networks: *id001
    environment:
    - FABRIC_LOGGING_SPEC=INFO
    - CORE_PEER_ID=peer0.insurera.obhoy.local
    - CORE_PEER_ADDRESS=peer0.insurera.obhoy.local:7051
    - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
    - CORE_PEER_CHAINCODEADDRESS=peer0.insurera.obhoy.local:7052
    - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
    - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.insurera.obhoy.local:7051
    - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.insurera.obhoy.local:7051
    - CORE_PEER_LOCALMSPID=InsurerAMSP
    - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
    - CORE_PEER_TLS_ENABLED=true
    - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
    - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
    - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
    - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=obhoy_net
    - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    - CORE_METRICS_PROVIDER=disabled
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    container_name: peer0.insurera.obhoy.local
    ports:
    - 10051:7051
    volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
    - ../../organizations/peerOrganizations/insurera.obhoy.local/peers/peer0.insurera.obhoy.local/msp:/etc/hyperledger/fabric/msp
    - ../../organizations/peerOrganizations/insurera.obhoy.local/peers/peer0.insurera.obhoy.local/tls:/etc/hyperledger/fabric/tls
    - peer-insurera:/var/hyperledger/production
  cli:
    image: hyperledger/fabric-tools:2.5.10
    container_name: obhoy-cli
    tty: true
    stdin_open: true
    networks:
    - obhoy
    environment:
    - GOPATH=/opt/gopath
    - FABRIC_LOGGING_SPEC=INFO
    - CORE_PEER_TLS_ENABLED=true
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
    - ../../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
    - ../../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
    - ../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
    - ../collections.json:/opt/gopath/src/github.com/hyperledger/fabric/peer/collections.json
    depends_on:
    - peer0.provider.obhoy.local
    - peer0.field.obhoy.local
    - peer0.insurera.obhoy.local
